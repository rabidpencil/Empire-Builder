<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Empire Builder — opening planner</title>
<style>
:root{--bg:#101319;--card:#191d26;--line:#2a3040;--ink:#e9ebf0;--dim:#8d93a4;--accent:#6ea8ff;--good:#54c98a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:40px}
header{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:17px;margin:0 0 12px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
label{font-size:13px;color:var(--dim)}
input[type=text]{background:#0c0e13;border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:10px;font-size:17px;width:70px;text-align:center}
button{background:#2b3852;color:#fff;border:1px solid #3d4f74;border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer}
button:active{background:#37476a}
button.go{background:var(--accent);border-color:var(--accent);color:#0b1220;font-weight:600;flex:1}
button.sm{padding:6px 10px;font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg div{padding:8px 12px;font-size:14px;color:var(--dim);cursor:pointer;background:#0c0e13}
.seg div.on{background:#2b3852;color:#fff}
main{padding:12px 16px}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.cost{font-size:22px;font-weight:700}
.mv{font-size:14px;color:var(--dim)}
.leg{font-size:14px;padding:3px 0;border-top:1px solid var(--line)}
.leg b{color:var(--accent);font-weight:600}
.pay{color:var(--good)}
.note{color:var(--dim);font-size:13px;margin:8px 0 0}
#track{font-size:13px;color:var(--dim)}
.empty{color:var(--dim);padding:20px 0;text-align:center}
</style></head><body>
<header>
<h1>Empire Builder — opening planner</h1>
<div class="row">
  <label>cards</label>
  <input type="text" id="c1" inputmode="numeric" placeholder="1">
  <input type="text" id="c2" inputmode="numeric" placeholder="2">
  <input type="text" id="c3" inputmode="numeric" placeholder="3">
</div>
<div class="row">
  <label>train</label>
  <div class="seg" id="spd"><div data-v="9">9 moves</div><div data-v="12">12 moves</div></div>
  <div class="seg" id="lds"><div data-v="2">2 loads</div><div data-v="3">3 loads</div></div>
</div>
<div class="row">
  <button class="go" id="go">Plan</button>
  <button class="sm" id="clr">Clear track</button>
</div>
<div id="track"></div>
</header>
<main id="out"><div class="empty">Enter your three card numbers and tap Plan.</div></main>

function makeCore(G, CARDS, CITIES){
  const N=G.cells.length, COST=G.cost;
  const adj=Array.from({length:N},()=>[]);
  const ekey=(u,v)=>u<v?u+'_'+v:v+'_'+u;
  for(const [u,v,s] of G.edges){ adj[u].push([v,s]); adj[v].push([u,s]); }
  const norm=s=>s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const NAME={}, SRC={};
  for(const c of CITIES){ NAME[c.key]=c.name;
    for(const l of c.loads){ const k=l.toLowerCase(); (SRC[k]=SRC[k]||[]).push(c.key); } }
  const CITY=G.city;

  class PQ{ constructor(){this.a=[];}
    push(x){const a=this.a;a.push(x);let i=a.length-1;while(i>0){const p=(i-1)>>1;if(a[p][0]<=a[i][0])break;[a[p],a[i]]=[a[i],a[p]];i=p;}}
    pop(){const a=this.a,t=a[0],l=a.pop();if(a.length){a[0]=l;let i=0;for(;;){const x=2*i+1,y=x+1;let m=i;
      if(x<a.length&&a[x][0]<a[m][0])m=x; if(y<a.length&&a[y][0]<a[m][0])m=y; if(m===i)break;[a[m],a[i]]=[a[i],a[m]];i=m;}}return t;}
    get size(){return this.a.length;} }

  // build weight of entering v across edge (u,v): free if that track is already owned
  function w(u,v,s,owned){ return owned.has(ekey(u,v))?0:COST[v]+s; }

  function dijkstra(src,owned){
    const d=new Float64Array(N).fill(Infinity); d[src]=0;
    const pq=new PQ(); pq.push([0,src]);
    while(pq.size){ const [c,u]=pq.pop(); if(c>d[u])continue;
      for(const [v,s] of adj[u]){ const nc=c+w(u,v,s,owned); if(nc<d[v]){d[v]=nc;pq.push([nc,v]);} } }
    return d;
  }

  function steiner(terms,owned){
    const t=[...new Set(terms)], k=t.length;
    if(k===1) return {cost:0,nodes:new Set([t[0]])};
    const F=1<<k, dp=[], par=[];
    for(let m=0;m<F;m++){ dp.push(new Float64Array(N).fill(Infinity)); par.push(new Array(N).fill(null)); }
    t.forEach((v,i)=>dp[1<<i][v]=0);
    for(let m=1;m<F;m++){
      const row=dp[m];
      for(let sub=(m-1)&m; sub; sub=(sub-1)&m){ const o=m^sub; if(sub>o)continue;
        const a=dp[sub],b=dp[o];
        for(let v=0;v<N;v++){ const s=a[v]+b[v]; if(s<row[v]){row[v]=s;par[m][v]=['m',sub,o];} } }
      const pq=new PQ();
      for(let v=0;v<N;v++) if(row[v]<Infinity) pq.push([row[v],v]);
      while(pq.size){ const [c,u]=pq.pop(); if(c>row[u])continue;
        for(const [v,s] of adj[u]){ const nc=c+w(u,v,s,owned); if(nc<row[v]){row[v]=nc;par[m][v]=['e',u];pq.push([nc,v]);} } }
    }
    const full=F-1; let root=0;
    for(let v=1;v<N;v++) if(dp[full][v]<dp[full][root]) root=v;
    const nodes=new Set(), st=[[full,root]];
    while(st.length){ const [m,v]=st.pop(); nodes.add(v); const p=par[m][v];
      if(!p)continue; if(p[0]==='m'){st.push([p[1],v]);st.push([p[2],v]);} else st.push([m,p[1]]); }
    return {cost:dp[full][root],nodes};
  }

  function tourMoves(nodes,stops,owned){
    const sub=new Set(nodes);
    for(const e of owned){ const [a,b]=e.split('_').map(Number); sub.add(a); sub.add(b); }
    const bfs=s=>{ const d=new Map([[s,0]]); const q=[s];
      for(let i=0;i<q.length;i++){ const u=q[i];
        for(const [v] of adj[u]) if(sub.has(v)&&!d.has(v)&&(nodes.has(v)||owned.has(ekey(u,v)))){ d.set(v,d.get(u)+1); q.push(v); } }
      return d; };
    const D=new Map(); for(const s of new Set(stops)) D.set(s,bfs(s));
    const n=stops.length; let best=Infinity;
    const perm=(arr,cur)=>{ if(!arr.length){
        const pos=new Map(cur.map((x,i)=>[x,i]));
        for(let j=0;j*2+1<n;j++) if(pos.get(j*2)>pos.get(j*2+1)) return;
        let tot=0; for(let i=0;i+1<cur.length;i++){ const d=D.get(stops[cur[i]]); const v=d.get(stops[cur[i+1]]);
          if(v===undefined) return; tot+=v; }
        if(tot<best) best=tot; return; }
      for(let i=0;i<arr.length;i++) perm(arr.filter((_,j)=>j!==i),cur.concat(arr[i])); };
    perm([...Array(n).keys()],[]);
    return best;
  }

  function plan(hand,loads,speed,owned,topn){
    owned=owned||new Set();
    const CD={}; for(const k in CITY) CD[k]=dijkstra(CITY[k],owned);
    const combos=[];
    const pick=(idx,chosen)=>{ if(chosen.length===loads){ combos.push(chosen.slice()); return; }
      for(let i=idx;i<hand.length;i++) for(const d of (CARDS[hand[i]]||[]))
        pick(i+1,chosen.concat([{card:hand[i],d}])); };
    pick(0,[]);
    const cand=[];
    for(const combo of combos){
      const srcLists=combo.map(c=>SRC[c.d.load.toLowerCase()]||[]);
      const walk=(i,acc)=>{ if(i===srcLists.length){
          const terms=[]; combo.forEach((c,j)=>{ terms.push(acc[j]); terms.push(norm(c.d.city)); });
          const uniq=[...new Set(terms)];
          let bound=0; const inn=new Set([uniq[0]]);
          while(inn.size<uniq.length){ let bd=Infinity,bn=null;
            for(const x of inn) for(const y of uniq) if(!inn.has(y)){ const v=CD[x][CITY[y]]; if(v<bd){bd=v;bn=y;} }
            bound+=bd; inn.add(bn); }
          cand.push({bound,combo,srcs:acc.slice(),terms});
          return; }
        for(const s of srcLists[i]) walk(i+1,acc.concat([s])); };
      walk(0,[]);
    }
    cand.sort((a,b)=>a.bound-b.bound);
    const out=[];
    for(const c of cand.slice(0,topn||8)){
      const tn=c.terms.map(k=>CITY[k]);
      const {cost,nodes}=steiner(tn,owned);
      const stops=[]; c.combo.forEach((x,j)=>{ stops.push(CITY[c.srcs[j]]); stops.push(CITY[norm(x.d.city)]); });
      const mv=tourMoves(nodes,stops,owned);
      out.push({build:cost,moves:mv,turns:Math.ceil(mv/speed),
        payout:c.combo.reduce((s,x)=>s+x.d.payout,0),
        legs:c.combo.map((x,j)=>({card:x.card,load:x.d.load,from:NAME[c.srcs[j]],to:x.d.city,pay:x.d.payout})),
        nodes:[...nodes]});
    }
    out.sort((a,b)=>a.build-b.build || a.moves-b.moves);
    return out;
  }
  return {plan,NAME,CITY,ekey,norm};
}

const core=makeCore(G,CARDS,CITIES);
let owned=new Set(), speed=9, loads=2;
try{ const s=localStorage.getItem('eb_track'); if(s) owned=new Set(JSON.parse(s));
     const t=localStorage.getItem('eb_train'); if(t){const o=JSON.parse(t);speed=o.s;loads=o.l;} }catch(e){}
function saveTrack(){ try{ localStorage.setItem('eb_track',JSON.stringify([...owned])); }catch(e){} }
function saveTrain(){ try{ localStorage.setItem('eb_train',JSON.stringify({s:speed,l:loads})); }catch(e){} }
function seg(id,val,set){ const el=document.getElementById(id);
  [...el.children].forEach(d=>{ d.classList.toggle('on', +d.dataset.v===val());
    d.onclick=()=>{ set(+d.dataset.v); saveTrain(); seg(id,val,set); }; }); }
seg('spd',()=>speed,v=>speed=v); seg('lds',()=>loads,v=>loads=v);
function trackLine(){ document.getElementById('track').textContent =
  owned.size ? owned.size+' segments of track already built (counted as free)' : 'no track built yet'; }
trackLine();
document.getElementById('clr').onclick=()=>{ owned=new Set(); saveTrack(); trackLine(); };
document.getElementById('go').onclick=()=>{
  const hand=['c1','c2','c3'].map(i=>document.getElementById(i).value.trim()).filter(Boolean);
  const bad=hand.filter(h=>!CARDS[h]);
  const out=document.getElementById('out');
  if(bad.length){ out.innerHTML='<div class="empty">No such card: '+bad.join(', ')+'</div>'; return; }
  if(hand.length<loads){ out.innerHTML='<div class="empty">Need at least '+loads+' cards for a '+loads+'-load train.</div>'; return; }
  out.innerHTML='<div class="empty">Working…</div>';
  setTimeout(()=>{
    const t0=Date.now();
    const res=core.plan(hand,loads,speed,owned,10);
    if(!res.length){ out.innerHTML='<div class="empty">No legal combination found.</div>'; return; }
    out.innerHTML=res.map((r,i)=>`<div class="res">
      <div class="hd"><span class="cost">$${r.build}M</span>
        <span class="mv">${r.moves} moves · ${r.turns} turn${r.turns===1?'':'s'} · pays <span class="pay">$${r.payout}M</span></span></div>
      ${r.legs.map(l=>`<div class="leg">card <b>${l.card}</b> · ${l.load}: ${l.from} &rarr; ${l.to} <span class="pay">$${l.pay}M</span></div>`).join('')}
      <div class="row" style="margin:10px 0 0"><button class="sm" data-i="${i}">Mark this track as built</button></div>
    </div>`).join('')+`<div class="note">${res.length} options · ${(Date.now()-t0)/1000}s · ranked by new track cost</div>`;
    out.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{
      const r=res[+b.dataset.i], s=new Set(r.nodes);
      for(const [u,v] of G.edges.map(e=>[e[0],e[1]])) if(s.has(u)&&s.has(v)) owned.add(core.ekey(u,v));
      saveTrack(); trackLine(); b.textContent='added'; b.disabled=true;
    });
  },30);
};
</script></body></html>
